<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кокос-чат</title>
<style>
:root{--bg:#fdf6e9;--card:#fff;--text:#3b2a1a;--muted:#8a7560;--accent:#8b5a2b;--mine:#f3d9b1;--line:#e8d9c0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--card:#2a2018;--text:#f1e6d6;--muted:#a89377;--accent:#d9a066;--mine:#4a3520;--line:#3d2f22}}
:root[data-theme="dark"]{--bg:#1d1610;--card:#2a2018;--text:#f1e6d6;--muted:#a89377;--accent:#d9a066;--mine:#4a3520;--line:#3d2f22}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{padding:12px 16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--line)}
header small{display:block;font-weight:400;color:var(--muted);font-size:13px}
#list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--mine)}
.n{font-size:12px;color:var(--accent);font-weight:600}
.empty{color:var(--muted);text-align:center;margin-top:30px}
form,.bar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);cursor:pointer}
#note{padding:0 16px 8px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>🥥 Кокос-чат<small>Общий чат игроков</small></header>
  <div id="list"><div class="empty">Загрузка…</div></div>
  <div id="note"></div>
  <div class="bar" id="nickbar" hidden>
    <input id="nick" maxlength="16" placeholder="Твой ник">
    <button id="nickbtn">Войти</button>
  </div>
  <div class="bar" id="msgbar" hidden>
    <input id="msg" maxlength="200" placeholder="Сообщение…" autocomplete="off">
    <button id="send">Отправить</button>
  </div>
</div>
<script>
(function(){
  var list=document.getElementById('list'),note=document.getElementById('note');
  var nickbar=document.getElementById('nickbar'),msgbar=document.getElementById('msgbar');
  var nick='';
  try{nick=localStorage.getItem('coco_nick')||''}catch(e){}
  function showBars(){nickbar.hidden=!!nick;msgbar.hidden=!nick}
  showBars();
  document.getElementById('nickbtn').onclick=function(){
    var v=document.getElementById('nick').value.trim().slice(0,16);
    if(!v)return;nick=v;
    try{localStorage.setItem('coco_nick',v)}catch(e){}
    showBars();render();
  };
  var rows=[],db=null,canWrite=true;
  function render(){
    list.textContent='';
    if(!rows.length){var e=document.createElement('div');e.className='empty';e.textContent='Пока тихо. Напиши первым! 🥥';list.appendChild(e);return}
    rows.forEach(function(r){
      var d=document.createElement('div');d.className='m'+(r.name===nick?' me':'');
      var n=document.createElement('div');n.className='n';n.textContent=r.name;
      var t=document.createElement('div');t.textContent=r.text;
      d.appendChild(n);d.appendChild(t);list.appendChild(d);
    });
    list.scrollTop=list.scrollHeight;
  }
  function send(){
    var inp=document.getElementById('msg'),text=inp.value.trim().slice(0,200);
    if(!text||!db||!nick)return;
    inp.value='';
    db.collection('chat').add({name:nick,text:text,ts:Date.now()}).catch(function(){
      note.textContent='Не удалось отправить: у тебя нет прав на запись.';
    });
  }
  document.getElementById('send').onclick=send;
  document.getElementById('msg').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
  window.claude.use('db').then(function(d){
    if(!d){list.textContent='';var e=document.createElement('div');e.className='empty';e.textContent='Чат недоступен. Войди в аккаунт Claude.';list.appendChild(e);msgbar.hidden=true;return}
    db=d;
    db.collection('chat').orderBy('ts','desc').limit(50).onSnapshot(function(s){
      rows=s.docs.map(function(x){return x.data()}).reverse();render();
    },function(){note.textContent='Ошибка загрузки чата.'});
  });
})();
</script>
</body>
</html>
